seed: 42

model:
  name: fpn_mamba_full
  fpn_channels: 256
  d_state: 16
  dropout: 0.3
  freeze_layers: 3
  use_fpn: true
  use_locality_mixing: true
  use_cross_mamba: true
  use_gem: true
  use_se: true

data:
  data_root: data
  mb_class_name: Meduloblastoma
  mb_target_count: 131
  non_mb_target_count: 630
  image_size: 224
  gaussian_sigma: 0.7
  imagenet_norm: true           # FPN-Mamba uses ImageNet normalisation
  deduplicate: true

training:
  num_folds: 5
  batch_size: 16
  max_epochs: 60
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 15
  warmup_epochs: 10
  grad_clip: 0.3
  calibration_fraction: 0.15    # fraction of each fold's training data held out for early stopping / threshold selection
  min_calibration_positives: 20 # bumps calibration_fraction up (capped below) if the calib set would have fewer MB positives than this
  max_calibration_fraction: 0.30 # safety cap on how far min_calibration_positives can push calibration_fraction up
  use_weighted_sampler: true
  use_mb_transform: true
  label_smoothing: 0.05
  pos_weight_scale: 1.0
  use_cuda: true
  num_workers: 0

output:
  run_dir: experiments/runs/fpn_mamba

wandb:
  enabled: true
  project: medulloblastoma-classification
  entity: sadeniji-carnegie-mellon-university
